TAB_FUSION: true
TAB_MARKER_COLS:
  - IgAbin_corrected
  - IgGbin_corrected
  - IgMbin_corrected
  - C1qbin_corrected
  - C3cbin_corrected
  - Kbin_corrected
  - lambdabin_corrected
  - Fbbin_corrected
