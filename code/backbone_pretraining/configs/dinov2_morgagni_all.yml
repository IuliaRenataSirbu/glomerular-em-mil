# Pretrain DINOv2 ViT-S/14 on Morgagni + Tecnai EM images (all disease classes).
# Ablation: maximally extended pretraining dataset.
# Set `data` to your full EM images directory.

data: /path/to/em/images_all   # set to your full dataset directory
out: ./checkpoints/dinov2_morgagni_all
overwrite: True

loggers:
  wandb:
    project: "glomerular-em-dino-pretrain"
    name: "dinov2_morgagni_all"

model: "dinov2/vits14"
method: "dinov2"

epochs: 500
callbacks:
  model_checkpoint:
    save_last: true
    save_top_k: -1
    every_n_epochs: 50
