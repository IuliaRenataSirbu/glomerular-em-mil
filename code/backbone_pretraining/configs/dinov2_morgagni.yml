# Pretrain DINOv2 ViT-S/14 on Morgagni EM images (used for main model and most ablations).
# Set `data` to your EM images directory.

data: /path/to/em/images   # set to your DATA_IMAGES_DIR
out: ./checkpoints/dinov2_morgagni
overwrite: True

loggers:
  wandb:
    project: "glomerular-em-dino-pretrain"
    name: "dinov2_morgagni"

model: "dinov2/vits14"
method: "dinov2"

epochs: 500
callbacks:
  model_checkpoint:
    save_last: true
    save_top_k: -1
    every_n_epochs: 50
